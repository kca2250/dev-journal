version: 2

project_name: djou

before:
  hooks:
    - go mod tidy

builds:
  - id: djou
    main: ./cmd/djou
    binary: djou
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kca2250/djou/internal/version.Version={{.Version}}
      - -X github.com/kca2250/djou/internal/version.Commit={{.Commit}}
      - -X github.com/kca2250/djou/internal/version.Date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: kca2250
    name: dev-journal
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

brews:
  - name: djou
    repository:
      owner: kca2250
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/kca2250/dev-journal"
    description: "CLI tool for managing development journals"
    license: "MIT"
    install: |
      bin.install "djou"
    test: |
      system "#{bin}/djou", "version"
